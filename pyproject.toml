[tool.poetry]
name = "django-mysite"
version = "0.1.0"
description = "Django shop/blog project"
authors = ["Aleksandra Obrezkova"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
Django = "4.2"
django-filter = "22.1"
djangorestframework = "3.14.0"
Pillow = "9.4.0"
gunicorn = "^21.2.0"
whitenoise = "^6.6.0"

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
